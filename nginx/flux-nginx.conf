# flux-nginx.conf — Livewire Flux asset rules for Webinoly (domain.com)
# Include at the top of the 443 server block, before `include common/...`.

# Flux virtual routes — must hit PHP, not be served as static files.
# `/flux/flux.min.js` ends in .js, so Webinoly's static-file regex would grab
# it and 404. `^~` beats `~*`, forcing everything under /flux (flux.js,
# flux.min.js, and the Pro font/icon endpoints) into index.php.
location ^~ /flux {
	try_files $uri /index.php?$query_string;
}
