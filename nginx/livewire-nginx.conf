# livewire-nginx.conf — Laravel + Livewire 3 rules for Webinoly (framing.vn)
location ^~ /livewire {
	try_files $uri /index.php?$query_string;
}

# Public review share route /r/{token} (GuestReview) — force into PHP.
location ^~ /r/ {
	try_files $uri /index.php?$query_string;
}

# Storage symlink (public posters/images via storage:link). Keys are versioned
# by immutable IDs, so serve straight from disk and cache hard; only fall back
# to PHP when the file is missing.
location ^~ /storage/ {
	try_files $uri $uri/ /index.php?$query_string;
	expires 30d;
	add_header Cache-Control "public, immutable";
	access_log off;
}

# Deny sensitive files.
location ~ /\.(?!well-known).* {
	deny all;
}
location ~* ^/(\.env|composer\.(json|lock)|package(-lock)?\.json|artisan)$ {
	deny all;
}
